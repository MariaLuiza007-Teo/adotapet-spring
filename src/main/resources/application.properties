spring.application.name=adotapet

# Banco H2 em memoria (os dados somem quando a aplicacao reinicia)
spring.datasource.url=jdbc:h2:mem:adotapetdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# O Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# Mostra no console os comandos SQL executados
spring.jpa.show-sql=true
