<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais para Adoção</title>
    <link rel="icon" type="image/jpeg" th:href="@{/img/favicon.jpeg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragmentos :: cabecalho}"></header>

    <main class="container">
        <section class="pets-grid">
            <div class="card" th:each="animal : ${animais}">
                <img th:if="${animal.foto != null and animal.foto != ''}"
                     th:src="@{/img/{foto}(foto=${animal.foto})}"
                     th:alt="'Foto de ' + ${animal.nome}">
                <h3 th:text="${animal.nome}">Nome</h3>
                <p th:text="${animal.especie + ' - ' + animal.sexo + (#strings.isEmpty(animal.idade) ? '' : ' - ' + animal.idade)}">Espécie - Sexo - Idade</p>
                <a th:href="@{/contato(animalId=${animal.id})}" class="btn btn-primary">Quero Adotar</a>
            </div>

            <p th:if="${#lists.isEmpty(animais)}">No momento não há animais disponíveis para adoção.</p>
        </section>
    </main>
</body>
</html>
